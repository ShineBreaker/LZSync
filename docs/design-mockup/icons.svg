    <text x="0" y="-8" font-size="12" font-weight="600" fill="#aab2bf">备选 · 浅底</text>
    <rect y="10" width="220" height="220" rx="52" fill="#e9edf3"/>
    <g transform="translate(0,10)">
      <path d="M110.00 70.00 A12 12 0 0 1 110.00 46.00 A64 64 0 0 1 173.91 113.35 Q173.03 121.11 175.31 126.08 L176.20 128.04 Q179.54 135.31 172.71 131.15 L154.52 120.07 Q149.39 116.95 149.95 112.09 A40 40 0 0 0 110.00 70.00 Z" fill="url(#gCyanL)"/>
