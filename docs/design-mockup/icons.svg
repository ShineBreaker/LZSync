    <rect x="278" y="10" width="16" height="16" rx="4" fill="#1d232c"/>
    <g transform="translate(278,10) scale(0.073)">
      <path d="M110.00 70.00 A12 12 0 0 1 110.00 46.00 A64 64 0 0 1 173.91 113.35 Q173.03 121.11 175.31 126.08 L176.20 128.04 Q179.54 135.31 172.71 131.15 L154.52 120.07 Q149.39 116.95 149.95 112.09 A40 40 0 0 0 110.00 70.00 Z" fill="url(#gCyan)"/>
