    <path d="M144.64 130.00 A12 12 0 0 1 165.43 142.00 A64 64 0 0 1 75.14 163.67 Q68.86 159.03 63.42 158.52 L61.28 158.31 Q53.31 157.57 60.33 153.73 L79.02 143.52 Q84.29 140.64 88.21 143.55 A40 40 0 0 0 144.64 130.00 Z" fill="url(#gPurple)"/>
    <path d="M75.36 130.00 A12 12 0 0 1 54.57 142.00 A64 64 0 0 1 80.94 52.98 Q88.11 49.86 91.27 45.40 L92.52 43.65 Q97.15 37.12 96.96 45.12 L96.46 66.41 Q96.32 72.41 91.84 74.36 A40 40 0 0 0 75.36 130.00 Z" fill="url(#gPink)"/>
