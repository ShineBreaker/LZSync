      <stop offset="0" stop-color="#57c8e8"/><stop offset="1" stop-color="#4eb4d1"/>
    </linearGradient>
    <linearGradient id="gPurple" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="180">
      <stop offset="0" stop-color="#7c6cf0"/><stop offset="1" stop-color="#7061d8"/>
    </linearGradient>
    <linearGradient id="gPink" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="180">
      <stop offset="0" stop-color="#ff7eb6"/><stop offset="1" stop-color="#e571a4"/>
    </linearGradient>
    <linearGradient id="gCyanL" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="180">
